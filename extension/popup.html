<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        width: 300px;
        margin: 0;
        padding: 14px;
      }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .sub { color: #6b7280; font-size: 11px; margin-bottom: 12px; }
      label { display: block; font-size: 11px; color: #6b7280; margin: 8px 0 3px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 7px;
        border: 1px solid #d1d5db;
        border-radius: 5px;
        font: inherit;
        background: transparent;
        color: inherit;
      }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        padding: 8px;
        border: 0;
        border-radius: 5px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #start { background: #002857; color: #fff; }
      #stop { background: #e5e7eb; color: #111827; }
      button:disabled { opacity: 0.45; cursor: default; }
      .stats {
        display: flex;
        gap: 6px;
        margin-top: 12px;
        text-align: center;
      }
      .stat { flex: 1; background: #f3f4f6; border-radius: 5px; padding: 6px 2px; }
      .stat b { display: block; font-size: 15px; }
      .stat span { font-size: 10px; color: #6b7280; }
      #last {
        margin-top: 10px;
        font-size: 11px;
        color: #6b7280;
        word-break: break-word;
        min-height: 28px;
      }
      .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
      .on { background: #3f9b50; }
      .off { background: #9ca3af; }
      @media (prefers-color-scheme: dark) {
        .stat { background: #1f2937; }
        input { border-color: #374151; }
        #stop { background: #374151; color: #f9fafb; }
      }
    </style>
  </head>
  <body>
    <h1>AI Overview Collector</h1>
    <div class="sub">Coherent Quadrant · drains the pipeline queue</div>

    <label for="bridge">Bridge URL</label>
    <input id="bridge" placeholder="http://127.0.0.1:15552" />

    <label for="market">Market (blank = bridge default)</label>
    <input id="market" placeholder="smartphone_market" />

    <div class="row">
      <button id="start">Start</button>
      <button id="stop">Stop</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="answered">0</b><span>answered</span></div>
      <div class="stat"><b id="missing">0</b><span>no overview</span></div>
      <div class="stat"><b id="failed">0</b><span>failed</span></div>
    </div>

    <div id="last"><span class="dot off"></span>idle</div>

    <script src="popup.js"></script>
  </body>
</html>
