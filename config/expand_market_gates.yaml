# Landscape expand market gate — drop junk BEFORE Final Excel / HTML.
#
# Used by chatgpt_expand Step 4c / 6m (EXPAND_MARKET_GATE=1 by default).
# Matching is case-insensitive substring on company/brand name unless noted.
#
# Only the "*" profile is used (the same rules for every market).

# One generic profile for every market. Per-market name lists (semiconductor,
# wearable, GLP-1, packaging) were removed: market knowledge comes from
# Google AI Mode at run time, and one market's facts live in its own
# _pipeline/analyst_review.json.
profiles:

  - name: Default landscape
    match: ["*"]
    drop_name_stems: []
    drop_name_regex:
      - '\(already listed\)'
    drop_regional_of_parent: true
    regional_parent_stems: []
    note: Minimal defaults for other markets.
