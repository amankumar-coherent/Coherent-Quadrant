# Coherent Quadrant — industry-wise X/Y scoring features
# Source: Coherent Quadrant_ Industry-wise Criteria.xlsx + market-tuned leaves
#
# Global defaults (fallback only). Prefer per-leaf axis_x / axis_y below —
# the agent also refines these per market query at score time.

axis_labels:
  x: Solution Capability
  y: Business Strategy

groups:
  Healthcare:
    Biotechnology:
      x:
        - Product Portfolio Breadth
        - Scientific Innovation
        - Integration & Interoperability
        - Manufacturing & Process Excellence
        - Regulatory & Quality Compliance
      y:
        - Geographic Expansion
        - Brand Reputation & Growth
        - Financial Performance
        - Innovation Roadmap
        - Business Expansion
    Clinical Diagnostic:
      x:
        - Product Portfolio Breadth
        - Diagnostic Accuracy
        - Innovation & R&D Capability
        - Workflow Efficiency
        - Regulatory & Quality Compliance
      y:
        - Geographic Expansion
        - Brand Reputation & Growth
        - Financial Performance
        - Innovation Roadmap
        - Business Expansion
    Healthcare IT:
      x:
        - Solution/Sevices Portfolio
        - Technology Innovation
        - Integration & Interoperability
        - Scalability Readiness
        - Regulatory & Quality Compliance
      y:
        - Geographic Expansion
        - Brand Reputation & Growth
        - Financial Performance
        - Innovation Roadmap
        - Business Expansion
    Medical Devices:
      axis_x: Clinical & Device Capability
      axis_y: Market Access & Growth Strategy
      x:
        - Device Portfolio Breadth
        - Clinical Performance & Safety
        - Innovation & R&D Capability
        - Manufacturing & Quality Systems
        - Regulatory & Quality Compliance
      y:
        - Geographic & Channel Reach
        - Brand Trust & Clinical Adoption
        - Financial Performance
        - Pipeline & Indication Expansion
        - Partnerships & Business Expansion
    Medical Imaging:
      x:
        - Product Portfolio Breadth
        - Product Quality & Performance
        - Innovation & R&D Capability
        - Manufacturing & Process Excellence
        - Regulatory & Quality Compliance
      y:
        - Geographic Expansion
        - Brand Reputation & Growth
        - Financial Performance
        - Innovation Roadmap
        - Business Expansion
    Pharmaceutical:
      axis_x: Therapeutic & Manufacturing Capability
      axis_y: Commercial Reach & Pipeline Strategy
      x:
        - Product / Molecule Portfolio
        - Therapeutic Coverage & Differentiation
        - Innovation & Clinical R&D
        - Manufacturing & Supply Reliability
        - Regulatory & Quality Compliance
      y:
        - Geographic Market Access
        - Brand / HCP Reputation
        - Financial Performance
        - Pipeline & Indication Roadmap
        - Partnerships & Business Expansion

  Chemical and Materials:
    Bulk Chemicals:
      x: &chem_x
        - Product Portfolio Breadth
        - Product Quality & Performance
        - Innovation & R&D Capability
        - Manufacturing & Process Excellence
        - Regulatory & Quality Compliance
      y: &default_y
        - Geographic Expansion
        - Brand Reputation & Growth
        - Financial Performance
        - Innovation Roadmap
        - Business Expansion
    Advanced Materials:
      x: *chem_x
      y: *default_y
    Agrochemicals:
      x: *chem_x
      y: *default_y
    Specialty and Fine Chemicals:
      x: *chem_x
      y: *default_y
    Food Ingredients:
      x: *chem_x
      y: *default_y
    Cosmetic Ingredients:
      x: *chem_x
      y: *default_y
    Polymers and Resins:
      x: *chem_x
      y: *default_y
    Green Chemicals:
      x: *chem_x
      y: *default_y

  ICT, Automation, Semiconductor:
    Aerospace and Defense:
      x: &ict_hw_x
        - Product Portfolio Breadth
        - Product Quality & Performance
        - Innovation & R&D Capability
        - Manufacturing & Process Excellence
        - Regulatory & Quality Compliance
      y: *default_y
    Automotive and Transportation:
      x: *ict_hw_x
      y: *default_y
    Construction Engineering:
      x: *ict_hw_x
      y: *default_y
    Consumer Electronics:
      x: *ict_hw_x
      y: *default_y
    Industrial Automation and Machinery:
      x: *ict_hw_x
      y: *default_y
    Information and Communication Technology:
      axis_x: Platform & Solution Capability
      axis_y: Scale & Go-to-Market Strategy
      x:
        - Solution/Services Portfolio
        - Technology Innovation
        - Integration & Interoperability
        - Scalability Readiness
        - Workflow Integration
      y: *default_y
    Semiconductors:
      axis_x: Process & Product Capability
      axis_y: Scale & Go-to-Market Strategy
      x:
        - Process / Node & Technology Leadership
        - Product Portfolio Breadth (logic, memory, analog, power, OSAT)
        - Design IP & Architecture Strength
        - Manufacturing Capacity, Yield & Packaging
        - Quality, Reliability & Compliance
      y:
        - Geographic & End-Market Reach
        - Customer / Ecosystem Partnerships
        - Financial Strength & CapEx Capacity
        - Technology & Product Roadmap
        - Capacity Expansion & Business Growth
    Smart Technologies:
      x: *ict_hw_x
      y: *default_y

  Others:
    Consumer Goods:
      x: *chem_x
      y: *default_y
    Energy:
      axis_x: Asset & Operating Capability
      axis_y: Portfolio & Commercial Strategy
      x:
        - Asset / Project Portfolio Breadth
        - Operational Efficiency & Throughput
        - Reliability & Asset Performance
        - Safety & Regulatory Compliance
        - Sustainability & Energy Transition
      y:
        - Geographic & Corridor Reach
        - Offtake / Customer Contracts
        - Financial Performance
        - Growth & Project Pipeline
        - Partnerships & Business Expansion
    Food and Beverages:
      axis_x: Product & Supply Capability
      axis_y: Brand & Commercial Strategy
      x:
        - Product Portfolio
        - Sustainability & Welfare
        - Supply-Chain Reliability
        - Distribution & Logistics
        - Multi-Region Coverage
      y:
        - Market Vision & Alignment
        - Customer Base & Adoption
        - Partner Ecosystem
        - Pricing Competitiveness
        - Financial Stability
    Packaging:
      axis_x: Packaging Solution Capability
      axis_y: Commercial & Growth Strategy
      x:
        - Structure / Material Portfolio
        - Barrier, Protection & Performance
        - Converting & Manufacturing Excellence
        - Sustainability & Circular Design
        - Regulatory & Food-Contact Compliance
      y:
        - Geographic Coverage
        - Brand / Converter Customer Reach
        - Financial Performance
        - Innovation Roadmap
        - Capacity & Business Expansion

